# XcodeGen spec. The Xcode project is generated rather than committed so the
# repo stays diffable and CI can build it without a .pbxproj merge conflict:
#   brew install xcodegen && xcodegen generate
name: GalaxyBridge
options:
  bundleIdPrefix: dev.galaxybridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  GalaxyBridge:
    type: application
    platform: iOS
    sources:
      - path: GalaxyBridge/Sources
      - path: GalaxyBridge/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # free-exercise-db (public domain): ~860 exercises with instructions.
      - path: GalaxyBridge/Resources/exercises-db.json
        buildPhase: resources
      # App icon and accent colour.
      - path: GalaxyBridge/Resources/Assets.xcassets
      # Translations: English is the source, Spanish is in es.lproj. XcodeGen
      # only turns .lproj folders into localized resources from their parent.
      - path: GalaxyBridge/Resources/Localized
        buildPhase: resources
    info:
      path: GalaxyBridge/Resources/Info.plist
      properties:
        CFBundleDisplayName: GalaxyBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        # Portrait only, like Health and Fitness: the dashboards and the gym
        # screen are laid out for it, and the phone turning sideways in a
        # pocket or on a bench mid-set only gets in the way.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - bluetooth-central
          - processing
        # Every string below is shown verbatim in the system prompt; Apple
        # rejects vague ones, and the user deserves to know why each is needed.
        NSBluetoothAlwaysUsageDescription: >-
          GalaxyBridge talks to your Galaxy Watch over Bluetooth to carry
          notifications, media control, contacts, calendar and health data.
        NSHealthShareUsageDescription: >-
          GalaxyBridge reads your existing health data only to avoid writing
          duplicate samples from the watch.
        NSHealthUpdateUsageDescription: >-
          GalaxyBridge saves the steps, heart rate, distance, energy and
          workouts measured by your Galaxy Watch into Apple Health.
        NSContactsUsageDescription: >-
          GalaxyBridge sends the contacts you choose to the watch so caller
          names and the contacts list work on your wrist.
        NSCalendarsFullAccessUsageDescription: >-
          GalaxyBridge sends your upcoming events to the watch so the agenda
          complication and tiles work offline.
        NSCameraUsageDescription: >-
          GalaxyBridge uses the camera to read food barcodes and to count
          your reps. Video is analysed on the iPhone and never saved or sent.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        NSLocationWhenInUseUsageDescription: >-
          Used only to label workout routes recorded by the watch.
        NSLocalNetworkUsageDescription: >-
          GalaxyBridge looks for your watch's wireless debugging service on
          this network so you do not have to type its address by hand.
        NSBonjourServices:
          - _adb-tls-pairing._tcp
          - _adb-tls-connect._tcp
          - _adb._tcp
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GalaxyBridge/Resources/GalaxyBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxybridge.companion
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: HealthKit.framework
      - sdk: Contacts.framework
      - sdk: EventKit.framework
      - sdk: CryptoKit.framework
      # Swift Charts for the history screens: a system framework, no dependency.
      - sdk: Charts.framework

  # Deliberately NOT hosted in the app. These tests cover the wire format and
  # the session crypto, which are pure logic; hosting them meant Xcode had to
  # launch the whole UI, and an unsigned CI build has no HealthKit entitlement,
  # so the process was killed before the suite even started. The protocol
  # sources are compiled straight into the bundle instead.
  GalaxyBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GalaxyBridge/Tests
      - GalaxyBridge/Sources/BLE/BridgeProtocol.swift
      - GalaxyBridge/Sources/BLE/SessionCrypto.swift
      - GalaxyBridge/Sources/ADB/BigUInt.swift
      - GalaxyBridge/Sources/ADB/Spake2.swift
      - GalaxyBridge/Sources/ADB/AdbPublicKey.swift
      - GalaxyBridge/Sources/Store/LocalHealthStore.swift
      - GalaxyBridge/Sources/Health/HealthKind.swift
      - GalaxyBridge/Sources/Health/Readiness.swift
      - GalaxyBridge/Sources/App/Localization.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GalaxyBridge:
    build:
      targets:
        GalaxyBridge: all
        GalaxyBridgeTests: [test]
    test:
      targets:
        - GalaxyBridgeTests
    archive:
      config: Release
